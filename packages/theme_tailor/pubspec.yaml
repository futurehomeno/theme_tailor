name: theme_tailor
description: >
  Code generator for Flutter's 3.0 ThemeExtension classes. 
  The generator can create themes and extensions on BuildContext 
  or ThemeData based on the lists of the theme properties
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: 3.41.2

dependencies:
  analyzer: ">=10.0.0 <12.0.0"
  build_config: ^1.1.0
  build: ^4.0.0
  collection: ^1.19.0
  json_annotation: ^4.11.0
  meta: ^1.17.0
  source_gen_test: ^1.3.0
  source_gen: ^4.2.0
  source_helper: ^1.3.0
  theme_tailor_annotation:
    path: ../theme_tailor_annotation

dev_dependencies:
  lints: 6.1.0
  test: 1.30.0

screenshots:
  - description: Package logo
    path: screenshots/logo.png
